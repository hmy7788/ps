<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Platform</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/problem.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>

<header>
  <a class="back-btn" id="back-btn" href="/">← 목록</a>
  <div id="prob-title-header">로딩 중...</div>
  <span class="fav-star" id="fav-star" title="즐겨찾기" onclick="toggleFavorite()">☆</span>
  <span class="badge" id="prob-badge"></span>
  <span class="meta-chip" id="prob-time"></span>
  <span class="meta-chip" id="prob-mem"></span>
  <span class="meta-chip" id="prob-users"></span>
</header>

<div id="layout">
  <!-- 왼쪽: 문제 설명 -->
  <div id="prob-desc">
    <div class="section-title">문제</div>
    <div id="desc-body"></div>
    <hr class="section-divider">
    <div class="section-title">입력</div>
    <div id="desc-input"></div>
    <div class="section-title">출력</div>
    <div id="desc-output"></div>
    <hr class="section-divider">
    <div class="section-title">예제 입력</div>
    <div id="desc-samples-in"></div>
    <div class="section-title">예제 출력</div>
    <div id="desc-samples-out"></div>
  </div>

  <div id="layout-resizer"></div>

  <!-- 오른쪽: 에디터 -->
  <div id="editor-side">
    <div id="editor-toolbar">
      <span id="toolbar-lang">Python 3</span>
      <span id="toolbar-file" style="font-size:11px;color:var(--text-dim)"></span>
      <select id="solution-select" style="display:none" onchange="loadSolutionFile(this.value)"></select>
      <span id="draft-status"></span>
    </div>
    <div id="editor-container"></div>
    <div id="panel-resizer"></div>
    <div id="bottom-panel">
      <div id="tab-bar">
        <button class="tab-btn active" onclick="switchTab('run')">실행</button>
        <button class="tab-btn" onclick="switchTab('submit')">제출</button>
      </div>

      <!-- 실행 탭 -->
      <div id="run-panel" class="tab-content active">
        <div id="run-toolbar">
          <button id="run-all-btn" onclick="runAll()">▶▶ 전체 실행</button>
          <span id="run-summary"></span>
          <button id="add-tc-btn" onclick="addTestCase()">+ 테케 추가</button>
        </div>
        <div id="testcase-list"></div>
      </div>

      <!-- 제출 탭 -->
      <div id="submit-panel" class="tab-content">
        <div id="submit-toolbar">
          <button id="gen-tc-btn" onclick="generateTestcases()">🧪 채점용 테케 만들기</button>
          <span id="tc-gen-status"></span>
          <button id="view-tc-btn" onclick="toggleTestcasePreview()" disabled>📋 테케 확인</button>
          <button id="submit-btn" onclick="submitCode()" disabled>▶ 제출</button>
          <button id="find-ce-btn" onclick="findCounterexample()">🔍 반례 찾기</button>
          <button id="save-solution-btn" onclick="showSaveMemoForm()">💾 백준에 저장</button>
        </div>
        <div id="save-memo-form" style="display:none">
          <input id="save-memo-input" type="text" placeholder="풀이 메모 (선택) — 예: dp, bfs">
          <button id="save-memo-confirm" onclick="saveSolution()">저장</button>
          <button id="save-memo-cancel" onclick="hideSaveMemoForm()">취소</button>
        </div>
        <div id="tc-preview" style="display:none"></div>
        <div id="submit-results"></div>
        <div id="ce-results"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="/static/common.js"></script>
<script>var require = { paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' } };</script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/editor/editor.main.nls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/editor/editor.main.js"></script>
<script>
let editor = null;
let currentProblem = null;

/* ── 좌우 레이아웃 리사이저 ─────────────────────────── */
(function () {
  const resizer = document.getElementById('layout-resizer');
  const left    = document.getElementById('prob-desc');
  let startX = 0, startW = 0;

  resizer.addEventListener('mousedown', e => {
    startX = e.clientX;
    startW = left.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cursor     = 'ew-resize';
    document.body.style.userSelect = 'none';

    const onMove = e => {
      const delta = e.clientX - startX;
      const total = document.getElementById('layout').offsetWidth;
      const newW  = Math.min(Math.max(startW + delta, 200), total - 300);
      left.style.width = newW + 'px';
    };

    const onUp = () => {
      resizer.classList.remove('dragging');
      document.body.style.cursor     = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup',   onUp);
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
  });
})();

/* ── 패널 리사이저 ───────────────────────────────────── */
(function () {
  const resizer   = document.getElementById('panel-resizer');
  const panel     = document.getElementById('bottom-panel');
  let startY      = 0;
  let startHeight = 0;

  resizer.addEventListener('mousedown', e => {
    startY      = e.clientY;
    startHeight = panel.offsetHeight;
    resizer.classList.add('dragging');
    document.body.style.cursor    = 'ns-resize';
    document.body.style.userSelect = 'none';

    const onMove = e => {
      const delta  = startY - e.clientY;   // 위로 드래그 → 패널 커짐
      const newH   = Math.min(
        Math.max(startHeight + delta, 80),
        window.innerHeight * 0.8
      );
      panel.style.height = newH + 'px';
    };

    const onUp = () => {
      resizer.classList.remove('dragging');
      document.body.style.cursor     = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup',   onUp);
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
  });
})();

const _qs = new URLSearchParams(location.search);
const problemId = _qs.get('id');
if (!problemId) location.href = '/';
(function restoreBackBtn() {
  const back = new URLSearchParams();
  ['page','q','tags','levels','solved','favorite'].forEach(k => {
    const v = _qs.get(k);
    if (v) back.set(k, v);
  });
  if (back.toString()) document.getElementById('back-btn').href = '/?' + back.toString();
})();

require(['vs/editor/editor.main'], () => {
  editor = monaco.editor.create(document.getElementById('editor-container'), {
    value: '',
    language: 'python',
    theme: 'vs-dark',
    fontSize: 15,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    automaticLayout: true,
    fontFamily: "'Cascadia Code','Fira Code',Consolas,monospace",
    tabSize: 4,
  });
  editor.onDidChangeModelContent(scheduleDraftSave);
  document.getElementById('save-memo-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveSolution();
    if (e.key === 'Escape') hideSaveMemoForm();
  });
  loadProblem();
});

/* ── 임시 코드 저장(자동저장) ─────────────────────────── */
let suppressAutosave = false;
let draftSaveTimer = null;

function scheduleDraftSave() {
  if (suppressAutosave || !currentProblem) return;
  clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(saveDraftNow, 1000);
}

async function saveDraftNow() {
  if (!editor || !currentProblem) return;
  const res = await fetch(`/api/problems/${currentProblem.id}/draft`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: editor.getValue() }),
  }).then(r => r.json()).catch(() => null);
  if (res?.saved) {
    const time = new Date(res.updated_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    setDraftStatus(`💾 임시저장됨 ${time}`, true);
  }
}

function setDraftStatus(text, showDiscard) {
  const el = document.getElementById('draft-status');
  el.innerHTML = showDiscard
    ? `${escHtml(text)} <a href="#" onclick="discardDraft();return false;" style="margin-left:6px">되돌리기</a>`
    : escHtml(text);
}

async function loadDraftIfAny(problemId) {
  const data = await fetch(`/api/problems/${problemId}/draft`).then(r => r.json()).catch(() => ({ exists: false }));
  if (data.exists) {
    suppressAutosave = true;
    editor.setValue(data.code);
    suppressAutosave = false;
    const time = new Date(data.updated_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    setDraftStatus(`✏️ 임시저장된 코드 (${time})`, true);
  } else {
    document.getElementById('draft-status').innerHTML = '';
  }
}

async function discardDraft() {
  if (!currentProblem) return;
  await fetch(`/api/problems/${currentProblem.id}/draft`, { method: 'DELETE' });
  document.getElementById('draft-status').innerHTML = '';
  suppressAutosave = true;
  await loadSolutionList(currentProblem.id);
  suppressAutosave = false;
}

async function loadProblem() {
  const p = await fetch(`/api/problems/${problemId}`).then(r => r.json());
  currentProblem = p;
  document.title = `#${p.id} ${p.title} - PS Platform`;

  document.getElementById('prob-title-header').textContent = `#${p.id} ${p.title}`;
  const star = document.getElementById('fav-star');
  star.textContent = p.favorite ? '⭐' : '☆';
  star.classList.toggle('active', !!p.favorite);
  const badge = document.getElementById('prob-badge');
  badge.textContent = LV_LABEL[p.level];
  badge.className = `badge ${lvClass(p.level)}`;
  document.getElementById('prob-time').textContent  = `⏱ ${p.time_limit}`;
  document.getElementById('prob-mem').textContent   = `💾 ${p.memory_limit}`;
  const users = document.getElementById('prob-users');
  if (p.accepted_user_count) {
    users.textContent = `✅ ${p.accepted_user_count.toLocaleString()}명`;
  } else {
    users.style.display = 'none';
  }

  document.getElementById('desc-body').innerHTML   = p.description;
  document.getElementById('desc-input').innerHTML  = p.input_desc;
  document.getElementById('desc-output').innerHTML = p.output_desc;

  renderMathInElement(document.getElementById('prob-desc'), {
    delimiters: [
      { left: '$$',  right: '$$',  display: true  },
      { left: '\\[', right: '\\]', display: true  },
      { left: '\\(', right: '\\)', display: false },
      { left: '$',   right: '$',   display: false },
    ],
    throwOnError: false,
  });

  const samplesInEl  = document.getElementById('desc-samples-in');
  const samplesOutEl = document.getElementById('desc-samples-out');
  if (p.samples.length) {
    const numLabel = (i) => p.samples.length > 1 ? `<div class="sample-pair-num">예제 ${i+1}</div>` : '';
    samplesInEl.innerHTML = p.samples.map((s, i) => `
      ${numLabel(i)}
      <div class="sample-pair">
        <div class="sample-block">
          <pre class="sample-pre">${escHtml(s.input.trimEnd())}</pre>
        </div>
      </div>`).join('');
    samplesOutEl.innerHTML = p.samples.map((s, i) => `
      ${numLabel(i)}
      <div class="sample-pair">
        <div class="sample-block">
          <pre class="sample-pre">${escHtml(s.output.trimEnd())}</pre>
        </div>
      </div>`).join('');
  } else {
    samplesInEl.innerHTML  = '<span style="color:var(--text-dim)">예제 없음</span>';
    samplesOutEl.innerHTML = '<span style="color:var(--text-dim)">예제 없음</span>';
  }

  if (editor) {
    suppressAutosave = true;
    await loadSolutionList(p.id);
    suppressAutosave = false;
    await loadDraftIfAny(p.id);
  }

  initTestCases(p.samples);
  loadSavedTestcases();
}

/* ── 저장된 풀이 파일 목록/로드 ─────────────────────── */
async function loadSolutionList(problemId) {
  const data = await fetch(`/api/problems/${problemId}/solutions`).then(r => r.json()).catch(() => null);
  const files = data?.files ?? [];
  const sel   = document.getElementById('solution-select');
  const label = document.getElementById('toolbar-file');

  if (!files.length) {
    label.textContent = '';
    sel.style.display = 'none';
    editor.setValue(
      `def solution():\n    pass\n\n\nif __name__ == "__main__":\n    import sys\n    data = sys.stdin.read()\n    # TODO: 입력 파싱 후 solution() 호출\n`
    );
    return;
  }

  if (files.length === 1) {
    sel.style.display = 'none';
    label.textContent = `— ${files[0].filename}`;
  } else {
    label.textContent = '';
    sel.innerHTML = files.map(f => `<option value="${escHtml(f.filename)}">${escHtml(f.filename)}</option>`).join('');
    sel.style.display = '';
  }

  await loadSolutionFile(files[0].filename);
}

async function loadSolutionFile(filename) {
  const problemId = new URLSearchParams(location.search).get('id');
  const data = await fetch(`/api/problems/${problemId}/solutions/${encodeURIComponent(filename)}`).then(r => r.json()).catch(() => null);
  if (data?.code != null) editor.setValue(data.code);
}

/* ── textarea 자동 높이 ──────────────────────────── */
function autoResizeTa(ta) {
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

document.addEventListener('input', e => {
  if (e.target.classList.contains('tc-ta')) autoResizeTa(e.target);
});

/* ── 테스트케이스 관리 ───────────────────────────── */
let testCases = [];

function syncFromDom() {
  testCases.forEach((tc, i) => {
    const inEl  = document.getElementById(`tc-in-${i}`);
    const expEl = document.getElementById(`tc-exp-${i}`);
    if (inEl)  tc.input    = inEl.value;
    if (expEl) tc.expected = expEl.value;
  });
}

function renderTestCases() {
  syncFromDom();
  const passed = testCases.filter(tc => tc.result === 'ok').length;
  const done   = testCases.filter(tc => tc.result !== null).length;
  document.getElementById('run-summary').textContent =
    done > 0 ? `${passed} / ${done} 통과` : '';

  document.getElementById('testcase-list').innerHTML = testCases.map((tc, i) => `
    <div class="tc-item">
      <div class="tc-hdr">
        <span class="tc-lbl">${escHtml(tc.label)}</span>
        <span class="tc-badge ${tc.result === 'ok' ? 'tc-ok' : tc.result === 'fail' ? 'tc-fail' : tc.result === 'error' ? 'tc-error' : tc.result === 'tle' ? 'tc-tle' : ''}">
          ${tc.result === 'ok'    ? `✅ 정답${tc.elapsed != null ? ` (${tc.elapsed}ms)` : ''}` :
            tc.result === 'fail'  ? `❌ 오답${tc.elapsed != null ? ` (${tc.elapsed}ms)` : ''}` :
            tc.result === 'error' ? `💥 ${escHtml(tc.errorLine || '런타임 에러')}` :
            tc.result === 'tle'   ? '⏱ 시간 초과' : ''}
        </span>
        <button class="tc-run-btn" onclick="runOne(${i})">▶ 실행</button>
        <button class="tc-del-btn" onclick="delTestCase(${i})">✕</button>
      </div>
      <div class="tc-body">
        <div class="tc-cols">
          <div>
            <div class="tc-col-label">입력</div>
            <textarea class="tc-ta" id="tc-in-${i}">${escHtml(tc.input)}</textarea>
          </div>
          <div>
            <div class="tc-col-label">기대 출력</div>
            <textarea class="tc-ta" id="tc-exp-${i}">${escHtml(tc.expected)}</textarea>
          </div>
        </div>
        ${tc.result !== null ? `
        ${tc.result === 'tle' ? `
        <div class="tc-stderr-box tc-tle-box">⏱ 시간 제한(${currentProblem.time_limit})을 초과했습니다.</div>` :
        tc.result === 'error' ? `
        ${tc.actual ? `<div><div class="tc-col-label">출력</div><pre class="tc-actual-pre fail">${escHtml(tc.actual)}</pre></div>` : ''}
        <div><div class="tc-col-label">오류</div><pre class="tc-stderr-box">${escHtml(tc.stderr)}</pre></div>` :
        `<div>
          <div class="tc-col-label">실제 출력</div>
          <pre class="tc-actual-pre ${tc.result}">${escHtml(tc.actual)}</pre>
        </div>`}` : ''}
      </div>
    </div>`).join('');

  document.querySelectorAll('.tc-ta').forEach(autoResizeTa);
}

function initTestCases(samples) {
  testCases = samples.map((s, i) => ({
    label: `샘플 ${i + 1}`,
    input: s.input.trimEnd(),
    expected: s.output.trimEnd(),
    result: null,
    actual: '',
    stderr: '',
    errorLine: '',
    elapsed: null,
  }));
  renderTestCases();
}

async function runOne(idx) {
  if (!editor || !currentProblem) return;
  syncFromDom();
  const tc = testCases[idx];

  const btn = document.querySelector(`#testcase-list .tc-item:nth-child(${idx + 1}) .tc-run-btn`);
  if (btn) { btn.disabled = true; btn.textContent = '...'; }

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code: editor.getValue(),
        stdin: tc.input,
        time_limit: currentProblem.time_limit,
      }),
    });
    const d = await res.json();
    tc.elapsed = d.elapsed_ms ?? null;
    if (d.status === 'TLE') {
      tc.result = 'tle';
      tc.actual = '';
      tc.stderr = '';
    } else if (d.status === 'ERROR') {
      tc.result = 'error';
      tc.actual = (d.stdout || '').trimEnd();
      tc.stderr = (d.stderr || '').trimEnd();
      const lines = tc.stderr.split('\n').map(l => l.trim()).filter(Boolean);
      tc.errorLine = lines[lines.length - 1] || '알 수 없는 오류';
    } else {
      tc.actual  = (d.stdout || '').trimEnd();
      tc.stderr  = '';
      tc.result  = tc.actual === tc.expected.trimEnd() ? 'ok' : 'fail';
    }
  } catch (e) {
    tc.result = 'error';
    tc.actual = '';
    tc.stderr = '서버 오류: ' + e.message;
    tc.errorLine = '서버 오류';
    tc.elapsed = null;
  }
  renderTestCases();
}

async function runAll() {
  if (!editor || !currentProblem) return;
  const btn = document.getElementById('run-all-btn');
  btn.disabled = true;
  btn.textContent = '⏳ 실행 중...';
  for (let i = 0; i < testCases.length; i++) await runOne(i);
  btn.textContent = '▶▶ 전체 실행';
  btn.disabled = false;
}

function addTestCase() {
  syncFromDom();
  const n = testCases.filter(tc => tc.label.startsWith('커스텀')).length + 1;
  testCases.push({ label: `커스텀 ${n}`, input: '', expected: '', result: null, actual: '', stderr: '', errorLine: '', elapsed: null });
  renderTestCases();
}

function delTestCase(idx) {
  syncFromDom();
  testCases.splice(idx, 1);
  renderTestCases();
}

/* ── 탭 전환 ─────────────────────────────────────────── */
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'run') || (i === 1 && tab === 'submit'));
  });
  document.getElementById('run-panel').classList.toggle('active', tab === 'run');
  document.getElementById('submit-panel').classList.toggle('active', tab === 'submit');
}

/* ── 채점용 테케 생성 ────────────────────────────────── */
async function generateTestcases() {
  if (!currentProblem) return;
  const btn    = document.getElementById('gen-tc-btn');
  const status = document.getElementById('tc-gen-status');
  if (btn.textContent.includes('다시') &&
      !confirm('기존 테케를 삭제하고 새로 생성합니다. 계속할까요?')) return;
  btn.disabled = true;
  btn.textContent = '생성 중...';
  status.textContent = '';
  status.className = '';

  try {
    const res = await fetch(`/api/problems/${currentProblem.id}/generate-testcases`, {
      method: 'POST',
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || '생성 실패');
    }
    const data = await res.json();
    status.textContent = `✅ ${data.count}개 생성 완료`;
    status.className = 'tc-gen-ok';
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('view-tc-btn').disabled = false;
    renderSubmitResults([]);
  } catch (e) {
    status.textContent = `❌ ${e.message}`;
    status.className = 'tc-gen-err';
  } finally {
    btn.disabled = false;
    btn.textContent = '🧪 다시 생성';
  }
}

/* ── 제출 ────────────────────────────────────────────── */
async function submitCode() {
  if (!editor || !currentProblem) return;
  const btn    = document.getElementById('submit-btn');
  const status = document.getElementById('tc-gen-status');
  btn.disabled = true;
  btn.textContent = '채점 중...';
  renderSubmitResults(null); // loading state

  try {
    const res = await fetch(`/api/problems/${currentProblem.id}/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code: editor.getValue(),
        time_limit: currentProblem.time_limit,
      }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || '제출 실패');
    }
    const data = await res.json();
    renderSubmitResults(data.results, data.passed, data.total);
  } catch (e) {
    document.getElementById('submit-results').innerHTML =
      `<div class="sr-error">❌ ${escHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ 제출';
  }
}

function renderSubmitResults(results, passed, total) {
  const el = document.getElementById('submit-results');
  if (results === null) {
    el.innerHTML = '<div class="sr-loading">채점 중...</div>';
    return;
  }
  if (!results.length) { el.innerHTML = ''; return; }

  const allPass = passed === total;
  const summaryClass = allPass ? 'sr-all-pass' : passed === 0 ? 'sr-all-fail' : 'sr-partial';
  const icon = allPass ? '🎉' : passed === 0 ? '❌' : '⚠️';

  el.innerHTML = `
    <div class="sr-summary ${summaryClass}">${icon} ${passed} / ${total} 통과</div>
    ${!allPass ? `<div class="sr-warn">⚠️ 전체 통과가 아닙니다. AI 생성 테케가 잘못됐을 수 있으니 반례 찾기로 재확인해보세요.</div>` : ''}
    <div class="sr-list">
      ${results.map((r, i) => {
        const badge = r.passed ? '<span class="sr-ok">✅</span>' :
                      r.status === 'TLE' ? '<span class="sr-tle">⏱ TLE</span>' :
                      r.status === 'ERROR' ? '<span class="sr-err">💥 ERROR</span>' :
                      '<span class="sr-err">❌ WA</span>';
        const time = r.elapsed_ms != null ? `${r.elapsed_ms}ms` : '-';
        return `<div class="sr-item">
          <span class="sr-idx">#${i + 1}</span>
          <span class="sr-type">${r.type}</span>
          ${badge}
          <span class="sr-time">${time}</span>
          <span class="sr-note">${escHtml(r.note)}</span>
        </div>`;
      }).join('')}
    </div>`;
}

/* ── 페이지 로드 시 기존 테케 확인 ──────────────────── */
async function loadSavedTestcases() {
  if (!currentProblem) return;
  try {
    const res  = await fetch(`/api/problems/${currentProblem.id}/testcases`);
    const data = await res.json();
    if (data.exists) {
      const date = new Date(data.generated_at).toLocaleDateString('ko-KR');
      document.getElementById('tc-gen-status').textContent = `✅ ${data.count}개 (${date})`;
      document.getElementById('tc-gen-status').className = 'tc-gen-ok';
      document.getElementById('gen-tc-btn').textContent = '🧪 다시 생성';
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('view-tc-btn').disabled = false;
    }
  } catch (_) {}
}

/* ── 즐겨찾기 ─────────────────────────────────────────── */
async function toggleFavorite() {
  if (!currentProblem) return;
  const data = await fetch(`/api/problems/${currentProblem.id}/favorite`, { method: 'POST' }).then(r => r.json());
  currentProblem.favorite = data.favorite;
  const star = document.getElementById('fav-star');
  star.textContent = data.favorite ? '⭐' : '☆';
  star.classList.toggle('active', data.favorite);
  star.classList.remove('pop'); void star.offsetWidth; star.classList.add('pop');
}

/* ── 백준에 저장 ─────────────────────────────────────── */
function showSaveMemoForm() {
  document.getElementById('save-memo-form').style.display = 'flex';
  document.getElementById('save-memo-input').focus();
  document.getElementById('save-solution-btn').disabled = true;
}
function hideSaveMemoForm() {
  document.getElementById('save-memo-form').style.display = 'none';
  document.getElementById('save-solution-btn').disabled = false;
  document.getElementById('save-memo-input').value = '';
}
async function saveSolution() {
  const btn = document.getElementById('save-solution-btn');
  if (!btn || !editor || !currentProblem) return;

  const memo = document.getElementById('save-memo-input').value.trim();
  hideSaveMemoForm();

  btn.disabled = true;
  btn.textContent = '저장 중...';

  try {
    const res = await fetch(`/api/problems/${currentProblem.id}/save-solution`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: editor.getValue(), memo }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || '저장 실패');
    }
    const data = await res.json();
    btn.textContent = `✅ ${data.filename} 저장 완료`;
    btn.style.cursor = 'default';
    await fetch(`/api/problems/${currentProblem.id}/draft`, { method: 'DELETE' });
    document.getElementById('draft-status').innerHTML = '';
  } catch (e) {
    btn.disabled = false;
    btn.textContent = `❌ ${e.message}`;
  }
}

/* ── testcase.ac 반례 찾기 ────────────────────────────── */
async function findCounterexample() {
  const btn = document.getElementById('find-ce-btn');
  const el  = document.getElementById('ce-results');
  if (!btn || !editor || !currentProblem) return;

  btn.disabled = true;
  btn.textContent = '탐색 중... (최대 90초)';
  el.innerHTML = '<div class="ce-banner ce-loading"><span class="ce-spinner"></span>testcase.ac에서 반례를 찾는 중...</div>';

  try {
    const res = await fetch(`/api/problems/${currentProblem.id}/find-counterexample`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: editor.getValue() }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '반례 찾기 실패');
    renderCounterexampleResult(data);
  } catch (e) {
    el.innerHTML = `<div class="ce-banner ce-err">❌ ${escHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 반례 찾기';
  }
}

function ceSourceBadge(data) {
  return data.source === 'ai-fallback'
    ? '<span class="ce-source">🤖 AI 폴백</span>'
    : '<span class="ce-source">testcase.ac</span>';
}

function renderCounterexampleResult(data) {
  const el = document.getElementById('ce-results');

  if (!data.registered) {
    el.innerHTML = `
      <div class="ce-banner ce-warn">
        <span class="ce-banner-icon">⚠️</span>
        <div><div class="ce-banner-title">반례 탐색 불가</div>
        <div class="ce-banner-sub">${escHtml(data.errorMessage || '이 문제는 testcase.ac에 등록되어 있지 않고, AI 폴백도 실패했습니다.')}</div></div>
      </div>`;
    return;
  }

  if (data.status === 'not_found') {
    const n = data.totalAttempted ?? data.totalCases ?? '?';
    el.innerHTML = `
      <div class="ce-banner ce-ok">
        <span class="ce-banner-icon">✅</span>
        <div><div class="ce-banner-title">반례를 찾지 못했습니다 ${ceSourceBadge(data)}</div>
        <div class="ce-banner-sub">${n}개 케이스 시도 · 완전한 정답 증명은 아닙니다</div></div>
      </div>`;
    return;
  }

  if (data.status === 'found') {
    const ce = data.counterexample;
    el.innerHTML = `
      <div class="ce-banner ce-fail">
        <span class="ce-banner-icon">❌</span>
        <div><div class="ce-banner-title">반례 발견 ${ceSourceBadge(data)}</div>
        <div class="ce-banner-sub">verdict: <span class="ce-verdict">${escHtml(ce.verdict || '?')}</span></div></div>
      </div>
      <div class="ce-diff">
        <div class="ce-diff-col">
          <div class="ce-diff-label">📥 입력</div>
          <pre class="ce-diff-pre">${escHtml(ce.testcase.text)}</pre>
        </div>
        <div class="ce-diff-col ce-diff-mine">
          <div class="ce-diff-label">🖊 내 출력</div>
          <pre class="ce-diff-pre">${escHtml(ce.targetOutput.text)}</pre>
        </div>
        <div class="ce-diff-col ce-diff-correct">
          <div class="ce-diff-label">✔ 정답 출력</div>
          <pre class="ce-diff-pre">${escHtml(ce.correctOutput.text)}</pre>
        </div>
      </div>`;
    return;
  }

  el.innerHTML = `
    <div class="ce-banner ce-err">
      <span class="ce-banner-icon">❌</span>
      <div><div class="ce-banner-title">반례 탐색 실패</div>
      <div class="ce-banner-sub">${escHtml(data.errorMessage || data.status || '알 수 없는 오류')}</div></div>
    </div>`;
}

/* ── 테케 미리보기 토글 ──────────────────────────────── */
let tcPreviewOpen = false;

async function toggleTestcasePreview() {
  const el  = document.getElementById('tc-preview');
  const btn = document.getElementById('view-tc-btn');
  if (tcPreviewOpen) {
    el.style.display = 'none';
    btn.textContent = '📋 테케 확인';
    tcPreviewOpen = false;
    return;
  }
  try {
    const res  = await fetch(`/api/problems/${currentProblem.id}/testcases`);
    const data = await res.json();
    if (!data.exists || !data.testcases?.length) {
      el.innerHTML = '<div class="tc-preview-empty">저장된 테케가 없습니다.</div>';
    } else {
      const typeIcon = { general: '📌', edge: '⚠️', stress: '🔥' };
      el.innerHTML = `
        <div class="tc-preview-header">채점용 테케 ${data.count}개 (${new Date(data.generated_at).toLocaleDateString('ko-KR')})</div>
        <div class="tc-preview-list">
          ${data.testcases.map((tc, i) => `
            <div class="tc-preview-item">
              <div class="tc-preview-meta">
                <span class="tc-preview-idx">#${i + 1}</span>
                <span class="tc-preview-type">${typeIcon[tc.type] || ''} ${tc.type}</span>
                <span class="tc-preview-note">${escHtml(tc.note || '')}</span>
              </div>
              <div class="tc-preview-io">
                <div class="tc-preview-col">
                  <div class="tc-col-label">입력</div>
                  <pre class="tc-preview-pre">${escHtml(tc.input.trimEnd())}</pre>
                </div>
                <div class="tc-preview-col">
                  <div class="tc-col-label">출력</div>
                  <pre class="tc-preview-pre">${escHtml(tc.output.trimEnd())}</pre>
                </div>
              </div>
            </div>`).join('')}
        </div>`;
    }
    el.style.display = 'block';
    btn.textContent = '📋 테케 닫기';
    tcPreviewOpen = true;
  } catch (e) {
    el.innerHTML = `<div class="tc-preview-empty">오류: ${escHtml(e.message)}</div>`;
    el.style.display = 'block';
  }
}
</script>
