<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통계 - PS Platform</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/stats.css">
</head>
<body>

<header>
  <a class="back-btn" href="/">← 목록</a>
  <div class="logo">📊 내 풀이 통계</div>
</header>

<main>
  <!-- 요약 카드 -->
  <section class="summary-cards" id="summary-cards"></section>

  <!-- 히트맵 -->
  <div class="stat-box">
    <div class="stat-box-title-row">
      <span class="stat-box-title">풀이 히트맵 (최근 1년)</span>
      <span class="streak-badge" id="streak-badge"></span>
    </div>
    <div id="heatmap-wrap">
      <div class="heatmap-months" id="heatmap-months"></div>
      <div class="heatmap-grid" id="heatmap-grid"></div>
      <div class="heatmap-legend">
        <span>적음</span>
        <span class="legend-cell lv0"></span>
        <span class="legend-cell lv1"></span>
        <span class="legend-cell lv2"></span>
        <span class="legend-cell lv3"></span>
        <span class="legend-cell lv4"></span>
        <span>많음</span>
      </div>
    </div>
  </div>

  <div class="stats-grid">
    <!-- 난이도별 분포 -->
    <div class="stat-box">
      <div class="stat-box-title">난이도별 분포</div>
      <div id="level-chart"></div>
    </div>

    <!-- 태그 Top 10 -->
    <div class="stat-box">
      <div class="stat-box-title">많이 푼 태그 Top 10</div>
      <div id="tag-chart"></div>
    </div>
  </div>

  <!-- 최근 풀이 -->
  <div class="stat-box recent-box">
    <div class="stat-box-title">최근 풀이</div>
    <div id="recent-list"></div>
  </div>
</main>

<script src="/static/common.js"></script>
<script>
const GRADE_RANGES = [
  { label: 'Bronze',   levels: [1,2,3,4,5],        cls: 'bronze' },
  { label: 'Silver',   levels: [6,7,8,9,10],        cls: 'silver' },
  { label: 'Gold',     levels: [11,12,13,14,15],    cls: 'gold' },
  { label: 'Platinum', levels: [16,17,18,19,20],    cls: 'platinum' },
  { label: 'Diamond',  levels: [21,22,23,24,25],    cls: 'diamond' },
  { label: 'Ruby',     levels: [26,27,28,29,30],    cls: 'ruby' },
];

async function load() {
  const [data, heatData] = await Promise.all([
    fetch('/api/stats').then(r => r.json()),
    fetch('/api/stats/heatmap').then(r => r.json()),
  ]);
  renderSummary(data, heatData.streak);
  renderHeatmap(heatData.heatmap);
  renderLevelChart(data.by_level);
  renderTagChart(data.top_tags);
  renderRecent(data.recent);
}

function renderHeatmap(heatmap) {
  const today = new Date();
  today.setHours(0,0,0,0);
  // 1년 전 일요일부터 시작
  const start = new Date(today);
  start.setFullYear(start.getFullYear() - 1);
  start.setDate(start.getDate() - start.getDay()); // 일요일로 맞춤

  const weeks = [];
  let cur = new Date(start);
  while (cur <= today) {
    const week = [];
    for (let d = 0; d < 7; d++) {
      const iso = cur.toISOString().slice(0, 10);
      week.push({ date: iso, count: heatmap[iso] ?? 0, future: cur > today });
      cur.setDate(cur.getDate() + 1);
    }
    weeks.push(week);
  }

  // 월 레이블
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  let monthHtml = '';
  weeks.forEach((week, wi) => {
    const firstDay = week.find(d => !d.future);
    if (firstDay && new Date(firstDay.date).getDate() <= 7) {
      const m = new Date(firstDay.date).getMonth();
      monthHtml += `<span class="month-label" style="grid-column:${wi+1}">${months[m]}</span>`;
    }
  });
  document.getElementById('heatmap-months').innerHTML = monthHtml;
  document.getElementById('heatmap-months').style.gridTemplateColumns = `repeat(${weeks.length}, 13px)`;

  // 셀
  const max = Math.max(...Object.values(heatmap), 1);
  const gridEl = document.getElementById('heatmap-grid');
  gridEl.style.gridTemplateColumns = `repeat(${weeks.length}, 13px)`;
  gridEl.innerHTML = weeks.map(week =>
    `<div class="heatmap-col">${week.map(day => {
      if (day.future) return `<div class="hm-cell lv0 future"></div>`;
      const lv = day.count === 0 ? 0 : day.count === 1 ? 1 : day.count <= 2 ? 2 : day.count <= 4 ? 3 : 4;
      return `<div class="hm-cell lv${lv}" title="${day.date}: ${day.count}개"></div>`;
    }).join('')}</div>`
  ).join('');
}

function renderSummary(data, streak) {
  if (streak > 0) {
    document.getElementById('streak-badge').textContent = `🔥 ${streak}일 연속`;
  }

  const byGrade = GRADE_RANGES.map(g => ({
    ...g,
    count: g.levels.reduce((s, l) => s + (data.by_level[l] ?? 0), 0),
  })).filter(g => g.count > 0);

  document.getElementById('summary-cards').innerHTML = `
    <div class="summary-card total">
      <div class="sc-num">${data.total}</div>
      <div class="sc-label">총 풀었던 문제</div>
    </div>
    ${byGrade.map(g => `
      <div class="summary-card">
        <div class="sc-num ${g.cls}">${g.count}</div>
        <div class="sc-label">${g.label}</div>
      </div>`).join('')}`;
}

function renderLevelChart(byLevel) {
  const grades = GRADE_RANGES.map(g => ({
    ...g,
    count: g.levels.reduce((s, l) => s + (byLevel[l] ?? 0), 0),
  })).filter(g => g.count > 0);

  const max = Math.max(...grades.map(g => g.count), 1);
  document.getElementById('level-chart').innerHTML = grades.map(g => `
    <div class="bar-row">
      <div class="bar-label">${g.label}</div>
      <div class="bar-track">
        <div class="bar-fill ${g.cls}" style="width:${(g.count / max * 100).toFixed(1)}%"></div>
      </div>
      <div class="bar-val">${g.count}</div>
    </div>`).join('');
}

function renderTagChart(topTags) {
  if (!topTags.length) {
    document.getElementById('tag-chart').innerHTML = '<div class="empty">데이터 없음</div>';
    return;
  }
  const max = topTags[0].count;
  document.getElementById('tag-chart').innerHTML = topTags.map(t => `
    <div class="bar-row">
      <div class="bar-label">${tagKo(t.tag)}</div>
      <div class="bar-track">
        <div class="bar-fill accent" style="width:${(t.count / max * 100).toFixed(1)}%"></div>
      </div>
      <div class="bar-val">${t.count}</div>
    </div>`).join('');
}

function renderRecent(recent) {
  if (!recent.length) {
    document.getElementById('recent-list').innerHTML = '<div class="empty">아직 기록이 없습니다.</div>';
    return;
  }
  document.getElementById('recent-list').innerHTML = recent.map(r => {
    const date = r.solved_at ? new Date(r.solved_at).toLocaleDateString('ko-KR', { month:'short', day:'numeric' }) : '';
    return `
      <a class="recent-item" href="/problem?id=${r.id}">
        <span class="recent-date">${date}</span>
        <span class="badge ${lvClass(r.level)}">${LV_LABEL[r.level]}</span>
        <span class="recent-title">#${r.id} ${escHtml(r.title)}</span>
      </a>`;
  }).join('');
}

load();
</script>
</body>
</html>
