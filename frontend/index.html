<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Platform</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/index.css">
</head>
<body>

<header>
  <a class="logo" href="/">PS Platform</a>
  <a class="stats-link" href="/stats">📊 통계</a>
  <input class="search-input" id="search-input" type="text" placeholder="🔍  문제 번호 또는 제목 검색...">

  <div class="filter-wrap">
    <button class="filter-btn" onclick="toggleDd('dd-tags')">
      태그 <span class="cnt" id="tag-cnt">0</span> ▾
    </button>
    <div class="dropdown" id="dd-tags">
      <input class="dd-search" type="text" placeholder="태그 검색..." oninput="renderTagList(this.value)">
      <div class="dd-list-wrap" id="tag-list-wrap">
        <div class="dd-list" id="tag-list"></div>
      </div>
    </div>
  </div>

  <div class="filter-wrap">
    <button class="filter-btn" onclick="toggleDd('dd-levels')">
      레벨 <span class="cnt" id="lv-cnt">0</span> ▾
    </button>
    <div class="dropdown" id="dd-levels" style="min-width:170px">
      <div class="dd-list-wrap" id="lv-list-wrap">
        <div class="dd-list" id="lv-list"></div>
      </div>
    </div>
  </div>

  <button class="filter-btn solved-filter-btn" id="solved-only-btn" onclick="onSolvedChange()">
    ✅ 풀었던 문제만
  </button>

  <button class="filter-btn fav-filter-btn" id="favorite-only-btn" onclick="onFavoriteChange()">
    ⭐ 즐겨찾기만
  </button>

  <button class="filter-btn inprogress-filter-btn" id="inprogress-only-btn" onclick="onInProgressChange()">
    📝 풀고 있는 문제만
  </button>
</header>

<div id="list-info">로딩 중...</div>
<div id="problem-grid"></div>
<div id="pagination"></div>

<script src="/static/common.js"></script>
<script>
const st = { q:'', tags:[], levels:[], page:1, size:24, total:0, solvedOnly:false, favoriteOnly:false, inProgressOnly:false };

(function restoreFromUrl() {
  const _qs = new URLSearchParams(location.search);
  if (_qs.get('page'))     st.page        = parseInt(_qs.get('page')) || 1;
  if (_qs.get('q'))        st.q           = _qs.get('q');
  if (_qs.get('tags'))     st.tags        = _qs.get('tags').split(',').filter(Boolean);
  if (_qs.get('levels'))   st.levels      = _qs.get('levels').split(',').map(Number).filter(Boolean);
  if (_qs.get('solved'))   st.solvedOnly  = true;
  if (_qs.get('favorite')) st.favoriteOnly = true;
  if (_qs.get('in_progress')) st.inProgressOnly = true;
})();

let allTags = [];

async function loadTags() {
  allTags = await fetch('/api/tags').then(r => r.json());
  renderTagList('');
}

function renderTagList(q) {
  const filtered = sortTags(allTags).filter(t => (tagKo(t)+t).toLowerCase().includes(q.toLowerCase()));
  const list = document.getElementById('tag-list');
  list.innerHTML = filtered.map(t => `
    <label>
      <input type="checkbox" value="${t}" ${st.tags.includes(t)?'checked':''} onchange="onTagChange()">
      ${tagKo(t)}
    </label>`).join('');
  updateScrollHint(list);
}

function onTagChange() {
  st.tags = [...document.querySelectorAll('#tag-list input:checked')].map(e => e.value);
  const cnt = document.getElementById('tag-cnt');
  cnt.textContent = st.tags.length;
  cnt.classList.toggle('show', st.tags.length > 0);
  st.page = 1; loadProblems();
}

(function buildLevelCheckboxes() {
  const groups = [
    { label:'Silver', color:'var(--silver)', levels:[6,7,8,9,10] },
    { label:'Gold',   color:'var(--gold)',   levels:[11,12,13,14,15] },
    { label:'Platinum', color:'var(--platinum)', levels:[16,17,18,19,20] },
  ];
  document.getElementById('lv-list').innerHTML = groups.map(g => `
    <div class="lv-group-title" style="color:${g.color}">${g.label}</div>
    ${g.levels.map(l => `<label>
      <input type="checkbox" value="${l}" ${st.levels.includes(l)?'checked':''} onchange="onLvChange()">
      <span class="badge ${lvClass(l)}">${LV_LABEL[l]}</span>
    </label>`).join('')}
  `).join('');
})();

// URL 파라미터에서 복원된 필터 상태를 UI에 반영
if (st.q) document.getElementById('search-input').value = st.q;
if (st.solvedOnly) document.getElementById('solved-only-btn').classList.add('active');
if (st.favoriteOnly) document.getElementById('favorite-only-btn').classList.add('active');
if (st.inProgressOnly) document.getElementById('inprogress-only-btn').classList.add('active');
(function syncCntBadges() {
  const tc = document.getElementById('tag-cnt');
  tc.textContent = st.tags.length;
  tc.classList.toggle('show', st.tags.length > 0);
  const lc = document.getElementById('lv-cnt');
  lc.textContent = st.levels.length;
  lc.classList.toggle('show', st.levels.length > 0);
})();

function onLvChange() {
  st.levels = [...document.querySelectorAll('#lv-list input:checked')].map(e => Number(e.value));
  const cnt = document.getElementById('lv-cnt');
  cnt.textContent = st.levels.length;
  cnt.classList.toggle('show', st.levels.length > 0);
  st.page = 1; loadProblems();
}

function onSolvedChange() {
  st.solvedOnly = !st.solvedOnly;
  document.getElementById('solved-only-btn').classList.toggle('active', st.solvedOnly);
  st.page = 1; loadProblems();
}

function onFavoriteChange() {
  st.favoriteOnly = !st.favoriteOnly;
  document.getElementById('favorite-only-btn').classList.toggle('active', st.favoriteOnly);
  st.page = 1; loadProblems();
}

function onInProgressChange() {
  st.inProgressOnly = !st.inProgressOnly;
  document.getElementById('inprogress-only-btn').classList.toggle('active', st.inProgressOnly);
  st.page = 1; loadProblems();
}

async function toggleFavorite(e, id) {
  e.preventDefault();
  e.stopPropagation();
  const star = e.currentTarget;
  const data = await fetch(`/api/problems/${id}/favorite`, { method: 'POST' }).then(r => r.json());
  star.classList.toggle('active', data.favorite);
  star.textContent = data.favorite ? '⭐' : '☆';
  star.closest('.prob-card')?.classList.toggle('favorited', data.favorite);
  star.classList.remove('pop'); void star.offsetWidth; star.classList.add('pop');
  if (st.favoriteOnly && !data.favorite) loadProblems();
}

async function loadProblems() {
  const p = new URLSearchParams();
  if (st.q) p.set('q', st.q);
  if (st.tags.length)   p.set('tags',   st.tags.join(','));
  if (st.levels.length) p.set('levels', st.levels.join(','));
  if (st.solvedOnly)    p.set('solved', '1');
  if (st.favoriteOnly)  p.set('favorite', '1');
  if (st.inProgressOnly) p.set('in_progress', '1');
  p.set('page', st.page); p.set('size', st.size);

  const data = await fetch('/api/problems?' + p).then(r => r.json());
  st.total = data.total;
  document.getElementById('list-info').textContent = `총 ${data.total.toLocaleString()}개`;
  renderGrid(data.items);
  renderPagination();
}

function _filterParams() {
  const p = new URLSearchParams();
  p.set('page', st.page);
  if (st.q)             p.set('q',       st.q);
  if (st.tags.length)   p.set('tags',    st.tags.join(','));
  if (st.levels.length) p.set('levels',  st.levels.join(','));
  if (st.solvedOnly)    p.set('solved',   '1');
  if (st.favoriteOnly)  p.set('favorite', '1');
  if (st.inProgressOnly) p.set('in_progress', '1');
  return p.toString();
}

function resetFilter() {
  st.q = ''; st.tags = []; st.levels = []; st.solvedOnly = false; st.favoriteOnly = false; st.inProgressOnly = false; st.page = 1;
  document.getElementById('search-input').value = '';
  document.getElementById('solved-only-btn').classList.remove('active');
  document.getElementById('favorite-only-btn').classList.remove('active');
  document.getElementById('inprogress-only-btn').classList.remove('active');
  document.querySelectorAll('#tag-list input').forEach(e => e.checked = false);
  document.querySelectorAll('#lv-list input').forEach(e => e.checked = false);
  document.getElementById('tag-cnt').classList.remove('show');
  document.getElementById('lv-cnt').classList.remove('show');
  loadProblems();
}

function renderGrid(items) {
  const el = document.getElementById('problem-grid');
  if (!items.length) {
    el.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--text-dim)">
      <div style="margin-bottom:14px">검색 결과가 없습니다.</div>
      <button onclick="resetFilter()" style="padding:6px 16px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;cursor:pointer" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text)'">필터 초기화</button>
    </div>`;
    return;
  }
  el.innerHTML = items.map(p => `
    <a class="prob-card${p.solved ? ' solved' : ''}${p.favorite ? ' favorited' : ''}" href="/problem?id=${p.id}&${_filterParams()}">
      <div class="card-top">
        <span class="pid">#${p.id}</span>
        <span class="ptitle">${escHtml(p.title)}</span>
        ${p.in_progress ? '<span class="badge draft-badge" title="풀고 있는 문제">📝</span>' : ''}
        <span class="badge ${lvClass(p.level)}">${LV_LABEL[p.level]}</span>
        <span class="fav-star${p.favorite ? ' active' : ''}" onclick="toggleFavorite(event, ${p.id})">${p.favorite ? '⭐' : '☆'}</span>
      </div>
      <div class="card-tags">${p.tags.slice(0,4).map(t=>`<span class="tag">${tagKo(t)}</span>`).join('')}</div>
      <div class="card-meta">
        <span>⏱ ${p.time_limit}</span>
        ${p.accepted_user_count ? `<span>✅ ${p.accepted_user_count.toLocaleString()}명</span>` : ''}
      </div>
    </a>`).join('');
}

function renderPagination() {
  const total = Math.ceil(st.total / st.size);
  const p = st.page;
  const el = document.getElementById('pagination');
  if (total <= 1) { el.innerHTML = ''; return; }
  let pages = new Set([1, total, p, p-1, p+1].filter(x => x>=1 && x<=total));
  pages = [...pages].sort((a,b) => a-b);
  let html = `<button class="pg-btn" onclick="goPage(${p-1})" ${p===1?'disabled':''}>‹</button>`;
  let prev = 0;
  for (const pg of pages) {
    if (pg - prev > 1) html += `<span style="color:var(--text-dim);padding:0 4px">…</span>`;
    html += `<button class="pg-btn ${pg===p?'cur':''}" onclick="goPage(${pg})">${pg}</button>`;
    prev = pg;
  }
  html += `<button class="pg-btn" onclick="goPage(${p+1})" ${p===total?'disabled':''}>›</button>`;
  el.innerHTML = html;
}
function goPage(p) { st.page = p; loadProblems(); window.scrollTo(0,0); }

function updateScrollHint(list) {
  const wrap = list.closest('.dd-list-wrap');
  if (!wrap) return;
  const atEnd = list.scrollHeight - list.scrollTop <= list.clientHeight + 2;
  wrap.classList.toggle('scrolled-end', atEnd);
}

function toggleDd(id) {
  document.querySelectorAll('.dropdown').forEach(el => { if (el.id !== id) el.classList.remove('open'); });
  const dd = document.getElementById(id);
  dd.classList.toggle('open');
  if (dd.classList.contains('open')) {
    const list = dd.querySelector('.dd-list');
    if (list) { updateScrollHint(list); list.onscroll = () => updateScrollHint(list); }
  }
}
document.addEventListener('click', e => {
  if (!e.target.closest('.filter-wrap')) document.querySelectorAll('.dropdown').forEach(el => el.classList.remove('open'));
});

let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { st.q = e.target.value.trim(); st.page = 1; loadProblems(); }, 300);
});

loadTags();
loadProblems();
</script>
</body>
</html>
